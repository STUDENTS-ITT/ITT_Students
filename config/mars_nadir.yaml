%YAML:1.0
# Конфигурация VINS-Mono для MARS-LVIG / HKairport03, надирная камера.
#
# Intrinsics: официальная калибровка MARS-LVIG HK_GNSS (HKairport03),
# data/calibration/mars_official/HK_GNSS(airport & island).yaml
# Экстринсики: геометрический надирный монтаж (run3_nadir_fix, 07.09.2026)

#--------------------------------------------------------------------------
# Топики
#--------------------------------------------------------------------------
imu_topic: "/imu0"
image_topic: "/cam0/image_raw"
output_path: "/home/USER/vnav/results/vins_out/"

#--------------------------------------------------------------------------
# Камера
#
# Исходное разрешение 2448x2048 уменьшено в 4 раза скриптом mars_to_bag.py
# (--scale 0.25). Все фокусные и главная точка поделены на 4;
# коэффициенты дисторсии от масштабирования не зависят.
#
# Полное разрешение: fx=fy=2319, cx=1224, cy=1024
# (оценка для сенсора 2/3", пиксель 3.45 мкм, объектив 8 мм)
#--------------------------------------------------------------------------
model_type: PINHOLE
camera_name: camera
image_width: 608
image_height: 512

distortion_parameters:
   k1: -0.05600000
   k2: 0.11800000
   p1: 0.00122000
   p2: 0.00064000

projection_parameters:
   fx: 358.7473
   fy: 361.0850
   cx: 292.9477
   cy: 261.2250

#--------------------------------------------------------------------------
# Экстринсики камера-IMU
#
# IMU DJI OSDK -- FLU: X вперёд, Y влево, Z вверх.
# Камера смотрит в надир, оптические оси ROS: X вправо по кадру,
# Y вниз по кадру, Z из объектива (то есть к земле).
#
# Столбцы матрицы -- оси камеры, выраженные в СК IMU:
#   X_камеры (вправо)      -> вправо у дрона        = -Y_imu
#   Y_камеры (вниз по кадру) -> назад у дрона        = -X_imu
#   Z_камеры (к земле)     -> вниз                   = -Z_imu
#
# Это предположение о монтаже. Если инициализация не сходится, первое,
# что надо проверить, -- именно эта матрица. Разворот камеры на 90 или
# 180 градусов вокруг вертикали здесь очень вероятен.
#
# estimate_extrinsic:
#   0 -- считать заданные значения точными
#   1 -- уточнять онлайн, стартуя с них   <- рекомендуется здесь
#   2 -- калибровать с нуля (на надирной съёмке НЕ РАБОТАЕТ, движение вырождено)
#--------------------------------------------------------------------------
estimate_extrinsic: 0

extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 0.00000000, -1.00000000,  0.00000000,
          -1.00000000,  0.00000000,  0.00000000,
           0.00000000,  0.00000000, -1.00000000]

extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [0.000000, 0.000000, 0.000000]

#--------------------------------------------------------------------------
# Фронтенд
#
# max_cnt поднят со штатных 150 до 250: над однородным полем и бетоном
# углов мало, запас точек заметно помогает удержать трекинг.
# freq: 0 означает "обрабатывать все приходящие кадры" -- при камере 10 Гц
# прореживать нечего.
#--------------------------------------------------------------------------
max_cnt: 250
min_dist: 20
freq: 0
F_threshold: 1.0
show_track: 1
equalize: 1
fisheye: 0

#--------------------------------------------------------------------------
# Оптимизация
#
# keyframe_parallax: 6 px (run2). run8e добавляет rot-gate в feature_manager.
#--------------------------------------------------------------------------
max_solver_time: 0.06
max_num_iterations: 10
keyframe_parallax: 6.0

#--------------------------------------------------------------------------
# Шумы IMU
# Значения для потребительского MEMS полётного контроллера. При наличии
# результатов анализа Аллана подставьте измеренные.
#--------------------------------------------------------------------------
acc_n: 0.08
gyr_n: 0.004
acc_w: 0.00004
gyr_w: 2.0e-6
g_norm: 9.79362

#--------------------------------------------------------------------------
# Замыкание петель — включено (run2_calib); ложные петли менее критичны,
# чем накопленный дрейф без loop closure на 15-минутном полёте.
#--------------------------------------------------------------------------
loop_closure: 1
load_previous_pose_graph: 0
fast_relocalization: 0
pose_graph_save_path: "/home/USER/vnav/results/pose_graph/"

#--------------------------------------------------------------------------
# Синхронизация камера-IMU
#
# В MARS-LVIG синхронизация аппаратная (PPS/GPRMC), метки в одной шкале
# UTC GPS, поэтому td = 0. Оригинальный VINS-Mono не умеет оценивать
# сдвиг онлайн (это появилось в VINS-Fusion), так что при подозрении на
# рассинхронизацию подбирайте td перебором.
#--------------------------------------------------------------------------
estimate_td: 0
td: 0.0

#--------------------------------------------------------------------------
# Строчная развёртка
# У Hikvision CA-050-11UC глобальный затвор, поэтому 0.
#--------------------------------------------------------------------------
rolling_shutter: 0
rolling_shutter_tr: 0

#--------------------------------------------------------------------------
# Визуализация. При замерах времени всё выключить.
#--------------------------------------------------------------------------
save_image: 0
visualize_imu_forward: 0
visualize_camera_size: 0.4
