# filter/tilt/run) и на математику не влияет — GUI использует её
# для сверки имён «набор ↔ пресет».
[meta]
dataset = static_300
data_dir = C:/ITT_Students_Qt_Version/ITT_Students-Katya/dataset_shum/static_300
error_ref = truth.txt

